<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07090e">
    <title>Trade Ledger | Sign In</title>
    <meta name="description" content="Sign in to Trade Ledger to access your reconciliation workspace.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page-minimal">
    <div class="minimal-auth-container">
        <a class="auth-home-logo" href="index.html" aria-label="Trade Ledger Home">
            <div class="brand-seal"><span class="seal-inner">TL</span></div>
            <span class="brand-title">TRADE LEDGER</span>
        </a>

        <div class="minimal-auth-card">
            <!-- Selected Plan Banner (if arriving from pricing link) -->
            <div class="selected-plan hidden" id="selected-plan" aria-live="polite">
                <i data-lucide="sparkles" style="color:var(--stamp-red);"></i>
                <span><strong id="selected-plan-name">Selected Plan</strong> <small id="selected-plan-detail"></small></span>
            </div>

            <div class="auth-tabs" role="tablist" aria-label="Account access mode">
                <button type="button" class="auth-tab active" role="tab" aria-selected="true" data-auth-mode="signin">Sign in</button>
                <button type="button" class="auth-tab" role="tab" aria-selected="false" data-auth-mode="signup">Create account</button>
            </div>

            <button class="google-button" id="btn-google" type="button">
                <span class="google-mark">G</span>
                <span>Continue with Google</span>
            </button>

            <div class="auth-divider"><span>or continue with email</span></div>

            <form id="auth-form" data-mode="signin" novalidate>
                <div class="form-group">
                    <label class="auth-field" for="auth-email">Email Address</label>
                    <input class="form-input" id="auth-email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                
                <div class="form-group">
                    <label class="auth-field" for="auth-password">Password</label>
                    <div class="password-wrap">
                        <input class="form-input" id="auth-password" type="password" name="password" placeholder="At least 8 characters" autocomplete="current-password" minlength="8" required>
                        <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password"><i data-lucide="eye"></i></button>
                    </div>
                </div>

                <div class="confirm-password hidden" id="confirm-password-wrap">
                    <div class="form-group">
                        <label class="auth-field" for="auth-password-confirm">Confirm Password</label>
                        <input class="form-input" id="auth-password-confirm" type="password" name="passwordConfirm" placeholder="Repeat your password" autocomplete="new-password">
                    </div>
                </div>

                <button class="btn btn-stamp btn-block auth-submit" id="auth-submit" type="submit">Sign in <i data-lucide="arrow-right"></i></button>
            </form>

            <div class="auth-actions">
                <button type="button" id="btn-reset" class="btn-link">Forgot password?</button>
            </div>
            
            <p id="auth-status" class="form-status auth-status" aria-live="polite"></p>
        </div>

        <div class="minimal-auth-footer">
            <a href="index.html">← Back to Trade Ledger</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            TradeLedgerAuth.init();
            
            // Check URL Query Parameters for Mode & Selected Plan
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            const planKey = urlParams.get('plan');

            if (mode === 'signup') {
                const signupBtn = document.querySelector('[data-auth-mode="signup"]');
                if (signupBtn) signupBtn.click();
            }

            if (planKey && window.TradeLedgerConfig?.plans?.[planKey]) {
                const plan = window.TradeLedgerConfig.plans[planKey];
                const planBox = document.getElementById('selected-plan');
                const planName = document.getElementById('selected-plan-name');
                const planDetail = document.getElementById('selected-plan-detail');

                if (planBox && planName && planDetail) {
                    planName.textContent = plan.name;
                    planDetail.textContent = `— $${plan.priceUsd} (${plan.durationDays} days access)`;
                    planBox.classList.remove('hidden');
                }
            }

            // Password Visibility Toggle
            const togglePasswordBtn = document.getElementById('toggle-password');
            const passwordInput = document.getElementById('auth-password');
            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    togglePasswordBtn.innerHTML = type === 'password' ? '<i data-lucide="eye"></i>' : '<i data-lucide="eye-off"></i>';
                    if (window.lucide) lucide.createIcons();
                });
            }

            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>
</html>
